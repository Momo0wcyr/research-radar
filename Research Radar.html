<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课题雷达｜可分享模板</title>
<style>
:root{--ink:#173b34;--deep:#123d35;--green:#2e7967;--paper:#f2f1eb;--card:#fffefa;--line:#d8ddd8;--muted:#74847f;--red:#b8473d;--amber:#c97822;--gold:#e5ac57}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.top{height:72px;padding:0 clamp(20px,5vw,74px);display:flex;align-items:center;justify-content:space-between;background:var(--deep);color:#fff}.brand{display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border:1px solid #96b8af;border-radius:50%;display:grid;place-items:center;font:700 20px Georgia}.brand strong{display:block;letter-spacing:.12em}.brand small{display:block;color:#9dc0b6;font:9px Arial;letter-spacing:.18em;margin-top:3px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:700}.btn.primary{background:var(--gold);color:var(--ink)}.btn.ghost{background:transparent;border:1px solid #809b94;color:inherit}.hero{background:var(--deep);color:#fff;padding:36px clamp(20px,5vw,74px) 60px}.hero .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.25em}.hero h1{font:600 clamp(30px,3.5vw,48px) "Songti SC","SimSun",serif;margin:10px 0}.hero p{color:#b8cec7;margin:0}.metrics{margin:-28px clamp(20px,5vw,74px) 0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #163d3412}.metric{padding:22px 24px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font:500 34px Georgia;margin-top:8px}.metric strong.text{font:700 14px "Microsoft YaHei"}.bar{height:7px;background:#e3e8e4;border-radius:8px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--green)}.toolbar{margin:26px clamp(20px,5vw,74px) 15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid transparent;background:transparent;padding:7px 11px;border-radius:16px;font-size:11px;color:#667771}.chip.active{background:var(--ink);color:#fff}.search{display:flex;gap:8px}.search input,.search select{border:1px solid #c8d1cc;background:#fff;border-radius:6px;padding:9px 11px;outline:0}.search input{width:240px}.content{margin:0 clamp(20px,5vw,74px)}.section-title{display:flex;gap:10px;align-items:baseline}.section-title h2{font:600 22px "Songti SC","SimSun";margin:0 0 12px}.section-title span{color:var(--muted);font-size:10px}.project{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:7px;margin-bottom:10px;overflow:hidden}.project[data-status="阻塞"]{border-left-color:var(--red)}.project[data-status="关注"]{border-left-color:var(--amber)}.project[data-status="待设定"]{border-left-color:#a1ada8}.row{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(110px,.6fr) minmax(180px,1fr) minmax(140px,.75fr) minmax(105px,.55fr) 28px;gap:18px;align-items:center}.row:hover{background:#f8f8f3}.name{display:flex;gap:11px;min-width:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:8px;flex:0 0 8px}.project[data-status="阻塞"] .dot{background:var(--red)}.project[data-status="关注"] .dot{background:var(--amber)}.project[data-status="待设定"] .dot{background:#9ba7a2}.name h3{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name p,.cell small{margin:0;color:#83918c;font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell span{display:block;color:#8b9894;font-size:9px;margin-bottom:5px}.cell strong{display:block;font-size:12px;margin-bottom:4px}.progress-head{display:flex;justify-content:space-between}.progress-head strong{font:600 14px Georgia}.unset{font:700 10px "Microsoft YaHei"!important;color:#7f8c87}.expand{width:24px;height:24px;border:1px solid #cad2ce;border-radius:50%;display:grid;place-items:center}.details{display:none;background:#f6f6f0;border-top:1px solid var(--line);padding:18px 22px 14px 40px;grid-template-columns:repeat(4,1fr);gap:14px}.project.open .details{display:grid}.detail{border-left:2px solid #b8c9c3;padding-left:11px}.detail:nth-child(2){border-color:#d98a81}.detail:nth-child(3){border-color:#69a08e}.detail:nth-child(4){border-color:#d5a35e}.detail span{color:#7e8d87;font-size:9px}.detail p{font-size:11px;line-height:1.6;margin:5px 0 0}.detail-actions{grid-column:1/-1;border-top:1px solid #e0e4df;padding-top:10px;display:flex;justify-content:space-between;align-items:center;color:#87938f;font-size:10px}.linkbtn{border:0;background:none;color:var(--green);font-weight:700}.empty{text-align:center;padding:65px 20px;border:1px dashed #bbc6c1;border-radius:8px;background:#ffffff55}.empty h2{font:600 24px "Songti SC","SimSun"}.empty p{color:#7b8b85;font-size:12px}.workflow{margin:34px clamp(20px,5vw,74px);padding:24px 28px;border:1px solid #c9d4ce;border-radius:8px;background:#e5ebe5;display:flex;align-items:center;justify-content:space-between;gap:25px}.workflow h2{font:600 19px "Songti SC","SimSun";margin:5px 0}.workflow p{font-size:11px;color:#64756e;margin:0}.workflow small{color:var(--green);font-weight:700;letter-spacing:.13em}.workflow-actions{display:flex;gap:8px;flex-wrap:wrap}.workflow .ghost{color:var(--ink);border-color:#91a49d}footer{padding:10px clamp(20px,5vw,74px) 32px;display:flex;justify-content:space-between;color:#83918c;font-size:10px}footer button{border:0;background:none;text-decoration:underline}.overlay{position:fixed;inset:0;background:#092d27bb;backdrop-filter:blur(4px);display:none;place-items:center;padding:20px;z-index:10}.overlay.show{display:grid}.modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:9px;box-shadow:0 24px 90px #061f1a66}.modal-head{position:sticky;top:0;background:var(--card);z-index:2;padding:22px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font:600 24px "Songti SC","SimSun";margin:4px 0}.modal-head small{color:var(--green);letter-spacing:.18em}.close{border:0;background:none;font-size:28px;color:#778680}.form{padding:20px 26px;display:grid;grid-template-columns:1fr 1fr;gap:14px 17px}.form label{font-size:10px;font-weight:700;color:#60716b}.form .wide{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid #cad3cf;border-radius:5px;padding:9px;background:#fff;outline:0;color:var(--ink);font-size:12px;font-weight:400}.form textarea{min-height:60px;resize:vertical;line-height:1.55}.progress-edit{display:flex;gap:9px;align-items:center;margin-top:9px}.progress-edit input[type="range"]{flex:1;margin:0;padding:0;accent-color:var(--green)}.progress-edit input[type="number"]{width:65px;margin:0}.modal-actions{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 26px;display:flex;gap:9px;align-items:center}.modal-actions .spacer{flex:1}.danger{color:var(--red);background:none;border:0}.review{padding:18px 26px}.review-item{border:1px solid var(--line);border-radius:6px;padding:13px;margin-bottom:10px}.review-item h3{margin:0 0 7px;font-size:13px}.review-item p{font-size:11px;color:#50655d;line-height:1.6;margin:4px 0}.review-item .suggest{padding:9px;background:#fff4dc;border-radius:5px;color:#875b1c}.notice{padding:11px 14px;background:#fff4dc;border:1px solid #ead099;border-radius:6px;font-size:11px;line-height:1.6;margin-bottom:12px}@media(max-width:960px){.row{grid-template-columns:1.4fr .7fr .8fr 25px}.row .stage{display:none}.row .report{display:none}.details{grid-template-columns:1fr 1fr}.workflow{align-items:flex-start;flex-direction:column}}@media(max-width:680px){.top{padding:0 16px}.actions .ghost{display:none}.hero{padding:28px 18px 48px}.metrics{margin:-22px 14px 0;grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.toolbar,.content{margin-left:14px;margin-right:14px}.search{width:100%}.search input{flex:1;width:auto}.row{grid-template-columns:1fr 90px 24px;padding:15px 13px}.row .owner,.row .stage,.row .report{display:none}.progress-cell{grid-column:2}.expand{grid-column:3}.details{grid-template-columns:1fr;padding-left:23px}.detail-actions{grid-column:1}.workflow{margin:26px 14px}.form{grid-template-columns:1fr}.form .wide{grid-column:1}footer{padding-left:14px;padding-right:14px}}
</style>
<style>
.hero-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.today-card{min-width:155px;border-left:1px solid #52766d;padding-left:23px;display:grid;grid-template-columns:1fr auto;align-items:end}
.today-card span{grid-column:1/-1;color:#b9cec8;font-size:12px}
.today-card strong{font:500 58px/1 Georgia,serif;margin-top:5px}
.today-card small{color:#9eb9b1;font-size:11px;writing-mode:vertical-rl}
@media(max-width:680px){.hero-inner{align-items:center}.today-card{min-width:100px;padding-left:16px}.today-card strong{font-size:44px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">R</div><div><strong>课题雷达</strong><small>RESEARCH RADAR</small></div></div><div class="actions"><button class="btn ghost" id="wallpaperBtn">导出桌面总览</button><button class="btn primary" id="newBtn">＋ 新建课题</button></div></header>
<section class="hero"><div class="hero-inner"><div><h1>课题进展，一页掌握</h1><p>本模板中的数据只保存在当前浏览器，可通过JSON备份迁移。</p></div><aside class="today-card" aria-label="今日日期"><span id="todayWeekday">—</span><strong id="todayDay">—</strong><small id="todayMonthYear">—</small></aside></div></section>
<section class="metrics"><div class="metric"><span>课题总数</span><strong id="totalMetric">0</strong></div><div class="metric"><span>导师标记困难</span><strong id="blockedMetric">0</strong></div><div class="metric"><span>7天内汇报</span><strong id="dueMetric">0</strong></div><div class="metric"><span>平均线性进度</span><strong id="averageMetric" class="text">待设定</strong><div class="bar"><i id="averageBar" style="width:0"></i></div></div></section>
<section class="toolbar"><div class="filters" id="filters"></div><div class="search"><input id="searchInput" placeholder="搜索课题、学生或编号"><select id="sortSelect"><option>优先级</option><option>汇报时间</option><option>进度</option></select></div></section>
<main class="content"><div class="section-title"><h2>课题全景</h2><span id="resultCount">0 个结果</span></div><div id="projectList"></div></main>
<section class="workflow"><div><small>AI辅助更新</small><h2>学生总结 → 更新包 → 导师确认</h2><p>先导出备份，将备份和学生总结交给Codex，再导入生成的JSON更新包。</p></div><div class="workflow-actions"><button class="btn ghost" id="exportBtn">导出数据</button><button class="btn primary" id="importBtn">导入数据或更新包</button></div></section>
<footer><span>离线单文件模板 · 每台电脑的数据相互独立</span><button id="resetBtn">清空本机数据</button></footer>
<input type="file" id="fileInput" accept="application/json" hidden>

<div class="overlay" id="editOverlay"><form class="modal" id="editForm"><div class="modal-head"><div><small>PROJECT RECORD</small><h2 id="modalTitle">新建课题</h2></div><button type="button" class="close" data-close>×</button></div><div class="form">
<label class="wide">课题名称<input name="title" required></label><label>课题编号<input name="code" required placeholder="例如：PROTAC-01"></label><label>课题类型<input name="category"></label><label>负责学生<input name="owner"></label><label>协作学生<input name="members"></label><label>当前节点<input name="stage"></label><label>状态<select name="status"><option>待设定</option><option>正常</option><option>关注</option><option value="阻塞">困难</option><option>已完成</option></select></label>
<label>线性进度 <b id="progressLabel">待设定</b><div class="progress-edit"><input name="progress" type="range" min="0" max="100" value="0"><input name="progressNumber" type="number" min="0" max="100" placeholder="—"></div></label><label>下次汇报<input name="nextReport" type="date"></label>
<label class="wide">课题目标<textarea name="goal"></textarea></label><label class="wide">导师的进度判断依据<textarea name="progressNote"></textarea></label><label class="wide">关键结果/里程碑<textarea name="milestone"></textarea></label><label class="wide">当前问题<textarea name="problem"></textarea></label><label class="wide">解决方案<textarea name="solution"></textarea></label><label class="wide">下一步行动<textarea name="nextAction"></textarea></label>
</div><div class="modal-actions"><button type="button" class="danger" id="deleteBtn">删除课题</button><span class="spacer"></span><button type="button" class="btn ghost" data-close>取消</button><button class="btn primary">保存课题</button></div></form></div>

<div class="overlay" id="reviewOverlay"><div class="modal"><div class="modal-head"><div><small>AI UPDATE REVIEW</small><h2>核对更新包</h2></div><button class="close" data-review-close>×</button></div><div class="review" id="reviewBody"></div><div class="modal-actions"><button class="btn ghost" data-review-close>取消</button><span class="spacer"></span><button class="btn primary" id="applyUpdateBtn">确认应用文字更新</button></div></div></div>

<script>
(()=>{'use strict';
const KEY='lab-project-radar-shareable-v1';const statuses=['全部','待设定','阻塞','关注','正常','已完成'];let projects=[];let filter='全部';let query='';let sort='优先级';let editingId=null;let pendingPack=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const uid=()=>crypto.randomUUID?crypto.randomUUID():'p-'+Date.now()+'-'+Math.random().toString(16).slice(2);const daysUntil=d=>d?Math.ceil((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000):9999;const dateLabel=d=>d?new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric'}).format(new Date(d+'T00:00:00')):'未安排';
function blank(){return{id:uid(),title:'',code:'',category:'',owner:'',members:'',progress:0,progressSet:false,status:'待设定',stage:'',nextReport:'',updatedAt:today(),goal:'',progressNote:'',milestone:'',problem:'',solution:'',nextAction:''}}
function updateToday(){const d=new Date();$('#todayWeekday').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d);$('#todayDay').textContent=d.getDate();$('#todayMonthYear').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long'}).format(d)}
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');projects=Array.isArray(data)?data:[]}catch{projects=[]}render()}
function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}
function statusRank(s){return({阻塞:0,关注:1,正常:2,待设定:3,已完成:4})[s]??5}
function filtered(){let rows=projects.filter(p=>(filter==='全部'||p.status===filter)&&(!query||[p.title,p.code,p.owner,p.members,p.stage,p.category].join(' ').toLowerCase().includes(query)));return rows.sort((a,b)=>sort==='汇报时间'?daysUntil(a.nextReport)-daysUntil(b.nextReport):sort==='进度'?(b.progressSet?b.progress:-1)-(a.progressSet?a.progress:-1):statusRank(a.status)-statusRank(b.status)||daysUntil(a.nextReport)-daysUntil(b.nextReport))}
function render(){const rated=projects.filter(p=>p.progressSet);const avg=rated.length?Math.round(rated.reduce((s,p)=>s+p.progress,0)/rated.length):null;$('#totalMetric').textContent=projects.length;$('#blockedMetric').textContent=projects.filter(p=>p.status==='阻塞').length;$('#dueMetric').textContent=projects.filter(p=>daysUntil(p.nextReport)>=0&&daysUntil(p.nextReport)<=7).length;$('#averageMetric').textContent=avg===null?'待设定':avg+'%';$('#averageMetric').className=avg===null?'text':'';$('#averageBar').style.width=(avg??0)+'%';$('#filters').innerHTML=statuses.map(s=>`<button class="chip ${filter===s?'active':''}" data-filter="${s}">${s}</button>`).join('');const rows=filtered();$('#resultCount').textContent=rows.length+' 个结果';$('#projectList').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><h2>${projects.length?'没有匹配的课题':'开始建立您的课题看板'}</h2><p>${projects.length?'请调整筛选或搜索条件。':'点击右上角“新建课题”，或导入已有JSON备份。'}</p><button class="btn primary" data-empty-new>＋ 新建第一个课题</button></div>`}
function card(p){const due=daysUntil(p.nextReport);return`<article class="project" data-id="${esc(p.id)}" data-status="${esc(p.status)}"><button class="row" data-toggle="${esc(p.id)}"><div class="name"><i class="dot"></i><div><h3>${esc(p.title)}</h3><p>${esc(p.code||'未编号')} · ${esc(p.category||'未分类')}</p></div></div><div class="cell owner"><span>负责学生</span><strong>${esc(p.owner||'待填写')}</strong><small>${p.members?'协作：'+esc(p.members):'暂无协作信息'}</small></div><div class="cell stage"><span>当前节点</span><strong>${esc(p.stage||'待填写')}</strong><small>${esc(p.milestone||'尚未记录里程碑')}</small></div><div class="cell progress-cell"><div class="progress-head"><span>线性进度</span><strong class="${p.progressSet?'':'unset'}">${p.progressSet?p.progress+'%':'待设定'}</strong></div><div class="bar"><i style="width:${p.progressSet?p.progress:0}%"></i></div></div><div class="cell report"><span>下次汇报</span><strong>${dateLabel(p.nextReport)}</strong><small>${due<0?'已逾期 '+Math.abs(due)+' 天':due===0?'今天':due<9999?due+' 天后':'待安排'}</small></div><div class="expand">＋</div></button><div class="details"><div class="detail"><span>课题目标</span><p>${esc(p.goal||'尚未填写')}</p></div><div class="detail"><span>当前问题</span><p>${esc(p.problem||'尚未填写')}</p></div><div class="detail"><span>解决方案</span><p>${esc(p.solution||'尚未填写')}</p></div><div class="detail"><span>下一步行动</span><p>${esc(p.nextAction||'尚未填写')}</p></div><div class="detail-actions"><span>最后更新 ${esc(p.updatedAt||'—')}</span><button class="linkbtn" data-edit="${esc(p.id)}">编辑课题</button></div></div></article>`}
function openEdit(id){editingId=id||null;const p=id?projects.find(x=>x.id===id):blank();if(!p)return;$('#modalTitle').textContent=id?'编辑课题':'新建课题';const f=$('#editForm');['title','code','category','owner','members','stage','status','nextReport','goal','progressNote','milestone','problem','solution','nextAction'].forEach(k=>f.elements[k].value=p[k]||'');f.elements.progress.value=p.progress||0;f.elements.progressNumber.value=p.progressSet?p.progress:'';$('#progressLabel').textContent=p.progressSet?p.progress+'%':'待设定';$('#deleteBtn').style.display=id?'block':'none';$('#editOverlay').classList.add('show')}
function closeEdit(){$('#editOverlay').classList.remove('show');editingId=null}
function formProject(){const f=$('#editForm');const old=editingId?projects.find(x=>x.id===editingId):blank();const n=f.elements.progressNumber.value;return{...old,title:f.elements.title.value.trim(),code:f.elements.code.value.trim(),category:f.elements.category.value.trim(),owner:f.elements.owner.value.trim(),members:f.elements.members.value.trim(),stage:f.elements.stage.value.trim(),status:f.elements.status.value,nextReport:f.elements.nextReport.value,goal:f.elements.goal.value.trim(),progressNote:f.elements.progressNote.value.trim(),milestone:f.elements.milestone.value.trim(),problem:f.elements.problem.value.trim(),solution:f.elements.solution.value.trim(),nextAction:f.elements.nextAction.value.trim(),progress:n===''?0:Math.max(0,Math.min(100,Number(n))),progressSet:n!=='',updatedAt:today()}}
function exportData(){const blob=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='课题雷达备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importFile(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(Array.isArray(d)){if(confirm('将用文件中的 '+d.length+' 个课题替换当前数据，是否继续？')){projects=d;save()}}else if(d&&d.type==='lab-radar-update'&&Array.isArray(d.updates)){showReview(d)}else alert('无法识别该JSON文件。')}catch{alert('文件格式不正确。')}};r.readAsText(file)}
function showReview(pack){pendingPack=pack;const items=pack.updates.map(u=>{const p=projects.find(x=>(x.code||'').toLowerCase()===(u.matchCode||'').toLowerCase());if(!p)return`<div class="review-item"><h3>未匹配：${esc(u.matchCode)}</h3><p>请检查课题编号，本项不会应用。</p></div>`;const changes=Object.entries(u.patch||{}).filter(([k,v])=>!['id','code','progress','progressSet'].includes(k)&&v!==undefined&&v!==p[k]).map(([k,v])=>`<p><b>${esc(({stage:'当前节点',milestone:'关键结果',problem:'当前问题',solution:'解决方案',nextAction:'下一步行动',nextReport:'下次汇报',status:'状态'})[k]||k)}：</b>${esc(v||'—')}</p>`).join('');const sg=u.progressSuggestion?`<p class="suggest"><b>AI进度建议：</b>${esc(u.progressSuggestion.min)}%–${esc(u.progressSuggestion.max)}%　${esc(u.progressSuggestion.reason||'')}<br>进度不会自动修改，请导入后由导师手动设置。</p>`:'';return`<div class="review-item"><h3>${esc(p.title)} · ${esc(p.code)}</h3>${changes||'<p>无文字字段变化。</p>'}${sg}</div>`}).join('');$('#reviewBody').innerHTML='<div class="notice">更新包只修改匹配课题的文字字段，不自动修改进度百分比。</div>'+items;$('#reviewOverlay').classList.add('show')}
function applyPack(){if(!pendingPack)return;projects=projects.map(p=>{const u=pendingPack.updates.find(x=>(x.matchCode||'').toLowerCase()===(p.code||'').toLowerCase());if(!u)return p;const patch={...(u.patch||{})};delete patch.id;delete patch.code;delete patch.progress;delete patch.progressSet;return{...p,...patch,updatedAt:today()}});pendingPack=null;$('#reviewOverlay').classList.remove('show');save()}
function wallpaper(){const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');x.fillStyle='#f2f1eb';x.fillRect(0,0,1920,1080);x.fillStyle='#123d35';x.fillRect(0,0,1920,140);x.fillStyle='#fff';x.font='700 40px Microsoft YaHei';x.fillText('课题雷达 · 项目总览',80,70);x.fillStyle='#b9d6cb';x.font='21px Microsoft YaHei';x.fillText(projects.length+' 个课题 · 更新于 '+new Date().toLocaleDateString('zh-CN'),80,110);projects.slice(0,8).forEach((p,i)=>{const col=i%2,row=Math.floor(i/2),l=80+col*890,t=180+row*214;x.fillStyle='#fff';x.fillRect(l,t,850,182);x.fillStyle=p.status==='阻塞'?'#b8473d':p.status==='关注'?'#c97822':p.status==='待设定'?'#9ba7a2':'#2e7967';x.fillRect(l,t,8,182);x.fillStyle='#173b34';x.font='700 26px Microsoft YaHei';x.fillText((p.title||'未命名课题').slice(0,25),l+30,t+40);x.fillStyle='#667770';x.font='17px Microsoft YaHei';x.fillText((p.code||'未编号')+' · '+(p.stage||'节点待填写')+' · '+(p.owner||'负责人待填写'),l+30,t+70);x.fillStyle='#e5e9e5';x.fillRect(l+30,t+91,650,14);if(p.progressSet){x.fillStyle='#2e7967';x.fillRect(l+30,t+91,650*p.progress/100,14)}x.fillStyle='#173b34';x.font='700 19px Microsoft YaHei';x.fillText(p.progressSet?p.progress+'%':'待设定',l+700,t+105);x.fillStyle='#465a53';x.font='16px Microsoft YaHei';x.fillText('下一步：'+(p.nextAction||'待填写').slice(0,36),l+30,t+140);x.fillStyle='#875b24';x.fillText('下次汇报：'+(p.nextReport||'待安排'),l+30,t+168)});const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='课题总览壁纸-'+today()+'.png';a.click()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.filter){filter=t.dataset.filter;render()}if(t.dataset.toggle){const el=t.closest('.project');el.classList.toggle('open');t.querySelector('.expand').textContent=el.classList.contains('open')?'−':'＋'}if(t.dataset.edit)openEdit(t.dataset.edit);if(t.dataset.emptyNew!==undefined)openEdit();if(t.hasAttribute('data-close'))closeEdit();if(t.hasAttribute('data-review-close')){$('#reviewOverlay').classList.remove('show');pendingPack=null}});
$('#newBtn').onclick=()=>openEdit();$('#editForm').onsubmit=e=>{e.preventDefault();const p=formProject();if(editingId)projects=projects.map(x=>x.id===editingId?p:x);else projects.unshift(p);closeEdit();save()};$('#deleteBtn').onclick=()=>{if(editingId&&confirm('确定删除这个课题吗？')){projects=projects.filter(x=>x.id!==editingId);closeEdit();save()}};const range=$('#editForm').elements.progress,num=$('#editForm').elements.progressNumber;range.oninput=()=>{num.value=range.value;$('#progressLabel').textContent=range.value+'%'};num.oninput=()=>{if(num.value===''){$('#progressLabel').textContent='待设定';return}const v=Math.max(0,Math.min(100,Number(num.value)));range.value=v;$('#progressLabel').textContent=v+'%'};$('#searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$('#sortSelect').onchange=e=>{sort=e.target.value;render()};$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};$('#applyUpdateBtn').onclick=applyPack;$('#wallpaperBtn').onclick=wallpaper;$('#resetBtn').onclick=()=>{if(confirm('确定清空本浏览器中的全部课题数据吗？请先导出备份。')){projects=[];save()}};updateToday();setInterval(updateToday,60000);load();
})();
</script>
<script>
(()=>{const filters=document.getElementById('filters');const localizeDifficulty=()=>filters?.querySelectorAll('[data-filter="阻塞"]').forEach(button=>button.textContent='困难');if(filters){localizeDifficulty();new MutationObserver(localizeDifficulty).observe(filters,{childList:true})}})();
</script>
